[project]
name = "merak-ide-server"
version = "0.1.1"
description = "Merak Backend — FastAPI + WebSocket + SSH + Yjs Collaboration"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.1",
    "asyncssh>=2.17.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "cryptography>=43.0.0",
    "aiofiles>=24.1.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "matplotlib>=3.9.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pillow>=10.4.0",
    "pypdf>=5.0.0",
    "PyMuPDF>=1.24.0",
    "python-pptx>=1.0.2",
    "PyYAML>=6.0.2",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
production = [
    "asyncpg>=0.30,<1",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
build = [
    "pyinstaller>=6.0",
]
protocols = [
    "scipy>=1.11,<2",
    "torch>=2.7,<3",
    "psutil>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
