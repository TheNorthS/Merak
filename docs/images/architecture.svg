<g font-family="Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="28" y="40" fill="#142b50" font-size="25" font-weight="700">MERAK  /  科研工作空间</text><text x="28" y="68" fill="#41516a" font-size="16" font-weight="400">用户定义目标与范围，工作流和对话共享项目上下文。</text><rect x="28" y="92" width="280" height="105" rx="12" fill="#ffffff" stroke="#dce4ee"/><text x="48" y="123" fill="#142b50" font-size="19" font-weight="650">研究输入</text><text x="48" y="151" fill="#41516a" font-size="15" font-weight="400">研究问题 · 参考论文 · 代码</text><text x="48" y="175" fill="#41516a" font-size="15" font-weight="400">笔记 · 已有数据与结果</text><rect x="338" y="92" width="444" height="105" rx="12" fill="#eaf2ff" stroke="#bdd3f6"/><text x="358" y="123" fill="#142b50" font-size="19" font-weight="650">Electron + React 桌面工作台</text><text x="358" y="151" fill="#41516a" font-size="15" font-weight="400">文件与编辑器 · 可视化工作流</text><text x="358" y="175" fill="#41516a" font-size="15" font-weight="400">实时日志 · 右侧对话面板</text><rect x="812" y="92" width="280" height="105" rx="12" fill="#ffffff" stroke="#dce4ee"/><text x="832" y="123" fill="#142b50" font-size="19" font-weight="650">执行配置</text><text x="832" y="151" fill="#41516a" font-size="15" font-weight="400">模型与审查器 · 交付目标</text><text x="832" y="175" fill="#41516a" font-size="15" font-weight="400">计算资源 · 时间 / 费用预算</text><path d="M308 145 H338" fill="none" stroke="#8093aa" stroke-width="2" marker-end="url(#arrow)"/><path d="M812 145 H782" fill="none" stroke="#8093aa" stroke-width="2" marker-end="url(#arrow)"/><path d="M560 197 V236" fill="none" stroke="#8093aa" stroke-width="2" marker-end="url(#arrow)"/><text x="28" y="258" fill="#142b50" font-size="20" font-weight="650">FastAPI + WebSocket  /  服务与编排</text><rect x="28" y="278" width="330" height="140" rx="12" fill="#ffffff" stroke="#dce4ee"/><text x="48" y="309" fill="#142b50" font-size="19" font-weight="650">工作流引擎</text><text x="48" y="337" fill="#41516a" font-size="15" font-weight="400">13 个节点 · 产物依赖</text><text x="48" y="361" fill