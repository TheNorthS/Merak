<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="594" viewBox="0 0 1120 594" role="img" aria-labelledby="title">
<title id="title">Merak 研究生命周期：失败手动恢复，完成后使用独立的对话修订</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8093aa"/></marker></defs>
<rect width="1120" height="594" rx="16" fill="#f5f8fc"/>
<g font-family="Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="28" y="40" fill="#142b50" font-size="25" font-weight="700">RUN → REVIEW → REFINE</text><text x="28" y="68" fill="#41516a" font-size="16" font-weight="400">运行恢复与完成后编辑是两条独立路径。</text><rect x="28" y="102" width="240" height="110" rx="12" fill="#ffffff" stroke="#dce4ee"/><text x="48" y="133" fill="#142b50" font-size="19" font-weight="650">用户启动</text><text x="48" y="161" fill="#41516a" font-size="15" font-weight="400">选择目标、材料与资源</text><text x="48" y="185" fill="#41516a" font-size="15" font-weight="400">明确科研执行范围</text><rect x="317" y="102" width="240" height="110" rx="12" fill="#ffffff" stroke="#dce4ee"/><text x="337" y="133" fill="#142b50" font-size="19" font-weight="650">执行与校验</text><text x="337" y="161" fill="#41516a" font-size="15" font-weight="400">模型 / 工具完成任务</text><text x="337" y="185" fill="#41516a" font-size="15" font-weight="400">产物与依赖通过检查</text><rect x="607" y="102" width="240" height="110" rx="12" fill="#eaf9f9" stroke="#b9e3e5"/><text x="627" y="133" fill="#142b50" font-size="19" font-weight="650">完成交付</text><text x="627" y="161" fill="#41516a" font-size="15" font-weight="400">保留完成状态</text><text x="627" y="185" fill="#41516a" font-size="15" font-weight="400">保存历史版本与审查记录</text><path d="M268 157 H317" fill="none" stroke="#8093aa" stroke-width="2" marker-end="url(#arrow)"/><path d="M557 157 H607" fill="none" stroke="#8093aa" stroke-width="2" marker-end="url(#arrow)"/><path d="M437 212 V275" fill="none" stroke="#8093aa" stroke-width="2" marker-end="url(#arrow)"/><rect x="317" y="275" width="240" height="110" rx="12" fill="#ffffff" stroke="#dce4ee"/><text x="337" y="306" fill="#142b50" font-size="19" font-weight="650">失败或取消</text><text x="337" y="334" fill="#41516a" font-size="15" font-weight="400">保留产物与检查点</text><text x="337" y="358" fill="#41516a" font-size="15" font-weight="400">记录中断原因</text><path d="M317 330 H268" fill="none" stroke="#8093aa" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="275" width="240" height="110" rx="12" fill="#ffffff" stroke="#dce4ee"/><text x="48" y="306" fill="#142b50" font-size="19" font-weight="650">修复后手动恢复</text><text x="48" y="334" fill="#41516a" font-size="15" font-weight="400">修复模型、环境或输入</text><text x="48" y="358" fill="#41516a" font-size="15" font-weight="400">按检查点与依赖继续</text><path d="M148 275 V240 H292 V183 H317" fill="none" stroke="#8093aa" stroke-width="2" marker-end="url(#arrow)"/><path d="M847 157 H957 V275" fill="none" stroke="#8093aa" stroke-width="2" marker-end="url(#arrow)"/><rect x="837" y="275" width="255" height="110" rx="12" fill="#eaf2ff" stroke="#bdd3f6"/><text x="857" y="306" fill="#142b50" font-size="19" font-weight="650">右侧对话框</text><text x="857" y="334" fill="#41516a" font-size="15" font-weight="400">讨论、审查与局部编辑</text><text x="857" y="358" fill="#41516a" font-size="15" font-weight="400">查看差异 → 批准保存</text><path d="M957 385 V445" fill="none" stroke="#8093aa" stroke-width="2" marker-end="url(#arrow)"/><rect x="707" y="445" width="385" height="110" rx="12" fill="#eaf9f9" stroke="#b9e3e5"/><text x="727" y="476" fill="#142b50" font-size="19" font-weight="650">独立局部修订</text><text x="727" y="504" fill="#41516a" font-size="15" font-weight="400">保留修改前内容与完成版本</text><text x="727" y="528" fill="#41516a" font-size="15" font-weight="400">不自动调度节点或重跑整个工作流</text><text x="28" y="476" fill="#142b50" font-size="18" font-weight="650">继续运行</text><text x="28" y="506" fill="#41516a" font-size="16" font-weight="400">针对尚未完成的任务，从可验证的状态恢复。</text><text x="28" y="565" fill="#0f6a76" font-size="16" font-weight="600">进一步实验或重新审查：用户明确发起新的执行。</text></g></svg>
