version: '3.8'

services:
  # MERAK IDE 后端
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    ports:
      - "8011:8011"
    environment:
      - MERAK_IDE_DATABASE_URL=sqlite+aiosqlite:///./data/merak_ide.db
      - MERAK_IDE_JWT_SECRET_KEY=${JWT_SECRET:-change-this-in-production}
      - MERAK_IDE_MERAK_SKILLS_PATH=/app/merak-skills
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Redis（用于协作状态缓存，可选）
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
