version: '3.8'

services:
  # ==================== 核心服务 ====================

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    ports:
      - "8011:8011"
    environment:
      - MERAK_IDE_DATABASE_URL=postgresql+asyncpg://merak:${DB_PASSWORD:-merak_secret}@postgres:5432/merak_ide
      - MERAK_IDE_JWT_SECRET_KEY=${JWT_SECRET:?Set a random JWT_SECRET of at least 32 characters}
      - MERAK_IDE_MERAK_SKILLS_PATH=/app/merak-skills
      - MERAK_IDE_DEBUG=false
      - MERAK_IDE_DATA_DIR=/app/data
      - MERAK_IDE_WORKSPACE_ROOT=/app/data/projects
      - MERAK_IDE_CORS_ORIGINS=${MERAK_IDE_CORS_ORIGINS:-["https://localhost"]}
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'

  # ==================== 数据库 ====================

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: merak_ide
      POSTGRES_USER: merak
      POSTGRES_PASSWORD: ${DB_PASSWORD:-merak_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merak -d merak_ide"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==================== 反向代理 ====================

  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - app_data:/app/data:ro
    depends_on:
      - server
    restart: unless-stopped

  # ==================== 监控 ====================

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  # ==================== 备份 ====================

  backup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${DB_PASSWORD:-merak_secret}
    volumes:
      - backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: /bin/sh
    command: ["-c", "crond -f -l 2"]
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  app_data:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  backups:
